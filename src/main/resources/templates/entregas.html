<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Entregas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b1120; color: #fff; font-family: sans-serif; }
        
        .card-custom {
            background-color: #111827;
            border-radius: 8px;
            padding: 12px 16px;
            border-left: 4px solid #3b82f6;
        }
        .card-border-blue { border-left-color: #06b6d4; }
        .card-border-orange { border-left-color: #f59e0b; }
        .card-border-green { border-left-color: #10b981; }
        .card-border-purple { border-left-color: #8b5cf6; }
        .card-border-red { border-left-color: #ef4444; }

        .label-title { font-size: 0.7rem; color: #9ca3af; text-transform: uppercase; font-weight: bold; }
        .label-value { font-size: 0.95rem; font-weight: bold; color: #ffffff; }

        .table-custom { color: #e5e7eb; vertical-align: middle; }
        .table-custom th { background-color: #111827; color: #9ca3af; font-size: 0.8rem; border-bottom: 1px solid #374151; }
        .table-custom td { border-bottom: 1px solid #1f2937; }

        /* Estilo exclusivo para Impressão */
        @media print {
            .no-print { display: none !important; }
            body { background-color: #fff !important; color: #000 !important; }
            .card-custom { border: 1px solid #ccc !important; color: #000 !important; background-color: #fff !important; }
            .label-value { color: #000 !important; }
            .table-custom { color: #000 !important; }
            .table-custom th, .table-custom td { color: #000 !important; border-bottom: 1px solid #ccc !important; }
        }
    </style>
</head>
<body class="p-4">

    <!-- Topo / Ações -->
    <div class="d-flex justify-content-between align-items-center mb-4 no-print">
        <div class="d-flex align-items-center gap-3">
            <a href="/carregamentos" class="btn btn-primary btn-sm fw-bold">← Voltar para Carregamentos</a>
            <h4 class="m-0 font-weight-bold">📦 Gestão de Entregas - Carregamento #<span id="carregamentoId" th:text="${carregamento?.id}">1</span></h4>
        </div>
        <div class="d-flex gap-2">
            <!-- Botão de Download PDF (chama o backend) -->
            <button onclick="baixarPDF()" class="btn btn-danger btn-sm fw-bold">📄 Baixar PDF</button>
            <!-- Botão Imprimir / Visualizar Impressão -->
            <button onclick="window.print()" class="btn btn-outline-light btn-sm fw-bold">🖨️ Imprimir / Visualizar</button>
        </div>
    </div>

    <!-- Cards Superiores COM A PLACA -->
    <div class="row g-2 mb-4">
        <div class="col">
            <div class="card-custom card-border-blue">
                <div class="label-title">MOTORISTA</div>
                <div class="label-value" id="cardMotorista" th:text="${carregamento?.motorista != null ? carregamento.motorista : 'Não informado'}">Não informado</div>
            </div>
        </div>
        <div class="col">
            <div class="card-custom card-border-orange">
                <div class="label-title">PLACA</div>
                <div class="label-value" id="cardPlaca" th:text="${carregamento?.placa != null ? carregamento.placa : 'Não informada'}">Não informada</div>
            </div>
        </div>
        <div class="col">
            <div class="card-custom card-border-green">
                <div class="label-title">VIAGEM</div>
                <div class="label-value" id="cardViagem" th:text="${carregamento?.viagem != null ? carregamento.viagem : '-'}">-</div>
            </div>
        </div>
        <div class="col">
            <div class="card-custom card-border-purple">
                <div class="label-title">TRANSPORTADORA</div>
                <div class="label-value text-truncate" id="cardTransportadora" th:text="${carregamento?.transportadora != null ? carregamento.transportadora : '-'}">-</div>
            </div>
        </div>
        <div class="col">
            <div class="card-custom card-border-red">
                <div class="label-title">ORDEM DE CARGA</div>
                <div class="label-value" id="cardOrdemCarga" th:text="${carregamento?.ordemCarga != null ? carregamento.ordemCarga : '-'}">-</div>
            </div>
        </div>
    </div>

    <!-- Tabela de Entregas -->
    <div class="table-responsive">
        <table class="table table-custom align-middle" id="tabelaEntregas">
            <thead>
                <tr>
                    <th>DELIVERY</th>
                    <th>NOTA FISCAL</th>
                    <th>CLIENTE</th>
                    <th>BAIRRO</th>
                    <th>CIDADE</th>
                    <th>PESO</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <!-- Suporte Thymeleaf (Caso renderizado via servidor) -->
                <tr th:each="e : ${entregas}">
                    <td th:text="${e.delivery != null ? e.delivery : '-'}">-</td>
                    <td th:text="${e.nf != null ? e.nf : '-'}">-</td>
                    <td th:text="${e.cliente != null ? e.cliente : '-'}">-</td>
                    <td th:text="${e.bairro != null ? e.bairro : '-'}">-</td>
                    <td th:text="${e.cidade != null ? e.cidade : '-'}">-</td>
                    <td th:text="${e.peso != null ? e.peso : '-'}">-</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Função para baixar o arquivo PDF gerado pelo backend
        function baixarPDF() {
            const carregamentoId = document.getElementById("carregamentoId").innerText.trim();
            if (carregamentoId) {
                window.location.href = `/api/pdf/carregamento/${carregamentoId}`;
            } else {
                alert("ID do carregamento não encontrado para gerar o PDF.");
            }
        }

        // Script auxiliar caso sua aplicação carregue os dados via JavaScript (Fetch/REST)
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id') || document.getElementById("carregamentoId").innerText.trim();

            const tabelaCorpo = document.getElementById("corpoTabela");

            // Se a tabela já possui linhas vindas do Thymeleaf, não precisa buscar via API
            if (tabelaCorpo && tabelaCorpo.children.length > 0 && !tabelaCorpo.children[0].innerText.includes("${")) {
                return;
            }

            if (id && id !== "${carregamento?.id}") {
                fetch(`/api/carregamentos/${id}/entregas`)
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.length > 0) {
                            tabelaCorpo.innerHTML = "";
                            data.forEach(item => {
                                const row = `
                                    <tr>
                                        <td>${item.delivery || '-'}</td>
                                        <td>${item.nf || '-'}</td>
                                        <td>${item.cliente || '-'}</td>
                                        <td>${item.bairro || '-'}</td>
                                        <td>${item.cidade || '-'}</td>
                                        <td>${item.peso || '-'}</td>
                                    </tr>
                                `;
                                tabelaCorpo.innerHTML += row;
                            });
                        }
                    })
                    .catch(err => console.log("Carregamento via API não requisitado ou falhou:", err));
            }
        });
    </script>
</body>
</html>
